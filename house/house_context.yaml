version: 1

house:
  name: Família Andrade Freitas

  description: >
    Apartamento residencial onde mora Henrique, sua esposa e sua filha e seu filho.
    O Alfredo é o assistente central da casa e possui satélites distribuídos
    pelos cômodos.

  language: pt-BR

  timezone: America/Sao_Paulo

#########################################################
# AMBIENTES — mapeamento cômodo → cenas do Home Assistant
# Usado pelo parser de smart_home.py para resolver cômodos
# e construir entity_ids de cenas automaticamente.
#
# Cada entrada:
#   id:           Constante usada no banco (ROOM_*)
#   names:        Frases que o usuário pode falar (sem acento, lowercase)
#   scene_prefix: Sufixo usado nas cenas do HA (scene.<ação>_<prefix>)
#   has_light_entity: true se o cômodo tem uma entidade light.* real
#                     (ex: escritório tem lâmpada inteligente direto)
#########################################################

ambientes:
  - id: ROOM_LIVING
    names:
      - sala
      - sala de estar
      - sala principal
    scene_prefix: sala

  - id: ROOM_BEDROOM_MASTER
    names:
      - quarto do casal
      - quarto casal
      - meu quarto
      - quarto principal
    scene_prefix: casal

  - id: ROOM_BEDROOM_LAURA
    names:
      - quarto da laura
      - quarto laura
      - quarto da filha
      - laura
    scene_prefix: quarto_laura

  - id: ROOM_OFFICE
    names:
      - escritorio
      - escritório
    scene_prefix: escritorio
    has_light_entity: true          # usa light.escritorio_luz_escritorio

  - id: ROOM_DINING
    names:
      - sala de jantar
      - sala jantar
    scene_prefix: sala_jantar

  - id: ROOM_KITCHEN
    names:
      - cozinha
    scene_prefix: cozinha

  - id: ROOM_BALCONY
    names:
      - varanda
      - sacada
    scene_prefix: varanda

  - id: ROOM_BATHROOM
    names:
      - banheiro
      - wc
    scene_prefix: banheiro

  - id: ROOM_LAUNDRY
    names:
      - lavanderia
      - area de servico
      - area de serviço
    scene_prefix: lavanderia

  - id: ROOM_GARDEN
    names:
      - jardim
      - quintal
      - area externa
    scene_prefix: jardim

  - id: ROOM_GARAGE
    names:
      - garagem
    scene_prefix: garagem

#########################################################
# COMO A CASA É
#########################################################

layout:

  description: >
    A sala é o ambiente central da casa.
    Todos os demais cômodos são acessados pela sala.

  rooms:

    living_room:
      name: Sala

      aliases:
        - sala
        - sala principal

      description: >
        É o ambiente central da casa.
        O servidor principal do Alfredo fica aqui.

      connected_to:
        - bedroom_casal
        - bedroom_daughter
        - kitchen
        - bathroom

      default_satellite: linux-server-satellite

    bedroom_casal:

      name: Quarto Casal

      aliases:
        - meu quarto
        - quarto principal
        - quarto casal

      connected_to:
        - ROOM_LIVING

      default_satellite: SAT_BEDROOM

    bedroom_daughter:

      name: Quarto da Filha

      aliases:
        - quarto da filha
        - quarto dela

      connected_to:
        - ROOM_LIVING

      default_satellite: SAT_DAUGHTER

    kitchen:

      name: Cozinha

      connected_to:
        - ROOM_LIVING

      default_satellite: SAT_KITCHEN

    bathroom:

      name: Banheiro

      connected_to:
        - ROOM_LIVING

#########################################################
# SATÉLITES
#########################################################

satellites:

  SAT_LIVING:

    room: living_room

    hardware: Linux

    description: >
      Servidor principal do Alfredo.
      Também funciona como satélite.

  SAT_BEDROOM:

    room: bedroom_casal

    hardware: Android

    description: >
      Samsung M21 transformado em satélite.

  SAT_DAUGHTER:

    room: bedroom_daughter

    hardware: ESP32-S3(ainda não comprado)

#########################################################
# DISPOSITIVOS
#########################################################

devices:

  living_room:

    - name: TV Samsung
      type: television
      integration: smartthings

    - name: Rack
      type: furniture

    - id: fan_living
      name: Ventilador da Sala
      type: fan
      room: living_room

      description: >
        Ventilador de teto da sala com luminária integrada.

      capabilities:
        - power
        - speed
        - light
        - all_off

      speed:
        min: 0
        max: 6

      aliases:
        - ventilador da sala
        - ventilador
        - ventilador daqui

  bedroom_casal:

    - id: fan_bedroom_casal
      name: Ventilador do quarto do casal
      type: fan
      room: bedroom_casal

      description: >
        Ventilador de teto do quarto do casal com luminária integrada.

      capabilities:
        - power
        - speed
        - light
        - all_off

      speed:
        min: 0
        max: 6

      aliases:
        - ventilador do quarto
        - ventilador
        - ventilador daqui

  bedroom_daughter:

    - id: fan_bedroom_daughter
      name: Ventilador da Laura
      type: fan
      room: bedroom_daughter

      description: >
        Ventilador de teto da filha com luminária integrada.

      capabilities:
        - power
        - speed
        - light
        - all_off

      speed:
        min: 0
        max: 6

      aliases:
        - ventilador da Laura
        - ventilador
        - ventilador daqui

  kitchen:

    - name: Geladeira
      type: appliance

    - name: Lava e Seca Brastemp
      type: appliance

#########################################################
# REGRAS DE INTERPRETAÇÃO
#########################################################

reasoning:

  location_priority: true

  rules:

    - >
      Sempre que um comando vier de um satélite,
      considere que palavras como:

      "aqui"

      "esta"

      "esse"

      "essa"

      "a luz"

      "a TV"

      referem-se ao cômodo onde o satélite está instalado,
      salvo se o usuário mencionar explicitamente outro cômodo.

    - >
      Caso exista apenas um dispositivo daquele tipo
      no cômodo, considere-o automaticamente.

    - >
      Se houver mais de um dispositivo do mesmo tipo,
      peça esclarecimento.

#########################################################
# CONTEXTO PARA O LLM
#########################################################

llm_context: |

  Você está controlando uma casa real.

  Antes de responder:

  1. Descubra de qual satélite veio a solicitação.

  2. Descubra em qual cômodo ele está.

  3. Consulte os dispositivos daquele cômodo.

  4. Se o usuário disser "liga a luz", utilize a luz daquele cômodo.

  5. Se disser "liga a TV", utilize a TV daquele cômodo.

  6. Só pergunte qual cômodo quando realmente houver ambiguidade.

  Nunca invente dispositivos inexistentes.

  Nunca invente cômodos.

  Sempre utilize apenas as informações deste arquivo.
